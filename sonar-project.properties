sonar.projectKey=taskflow
sonar.projectName=TaskFlow
sonar.sourceEncoding=UTF-8

# Application code vs. test code
sonar.sources=src
sonar.exclusions=**/*.test.jsx,**/*.test.js,src/setupTests.js,src/main.jsx
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js

# Coverage imported from Vitest (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
